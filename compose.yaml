services:
  app:
    build: .
    image: python-service:latest
    container_name: python_app_service
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - SERVICE_NAME=${SERVICE_NAME:-Python-Service}
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3